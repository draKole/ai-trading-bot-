services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=drake_trading
      - POSTGRES_USER=drake
      - POSTGRES_PASSWORD=drake_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - TRADING_MODE=PAPER
      - LIVE_ALLOWED=false
      # Required at deploy time; never commit or bake application secrets.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be injected from the deployment environment}
      # CI may opt into a clearly marked synthetic fixture; deployments do not.
      - MARKET_DATA_BOOTSTRAP_CI=${MARKET_DATA_BOOTSTRAP_CI:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /var/log/drake:/var/log/drake

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=drake_trading
      - POSTGRES_USER=drake
      - POSTGRES_PASSWORD=drake_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drake -d drake_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
